
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CC105</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #f8e8e8, #f5d4d8, #fff1e8);
    font-family: Georgia, serif;
    color: #684b50;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 650px;
    text-align: center;
    animation: fadeIn 1.5s ease;
}

h1 {
    font-size: 30px;
    margin-bottom: 12px;
    font-weight: normal;
}

.subtitle {
    font-size: 14px;
    margin-bottom: 30px;
    color: #92747a;
}

input {
    width: 85%;
    max-width: 350px;
    padding: 14px;
    border: 1px solid #d9aeb5;
    border-radius: 25px;
    background: #fffaf9;
    outline: none;
    text-align: center;
    font-size: 15px;
    color: #684b50;
}

button {
    border: none;
    padding: 12px 25px;
    border-radius: 25px;
    background: #c98794;
    color: white;
    cursor: pointer;
    margin-top: 18px;
    font-size: 14px;
    transition: 0.3s;
}

button:hover {
    background: #ad6978;
    transform: translateY(-2px);
}

#errorMessage {
    color: #b94d62;
    font-size: 13px;
    margin-top: 15px;
    display: none;
}

.letter {
    display: none;
    background: rgba(255, 250, 247, 0.94);
    padding: 30px 25px;
    border-radius: 15px;
    box-shadow: 0 10px 35px rgba(120, 70, 80, 0.12);
    text-align: left;
    line-height: 1.9;
    font-size: 14px;
    animation: letterOpen 1.5s ease;
}

.letter-title {
    text-align: center;
    margin-bottom: 22px;
    font-size: 23px;
    font-style: italic;
}

#confessionText {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.music {
    display: none;
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid #ead2d5;
    text-align: center;
    animation: fadeIn 2s ease;
}

.music p {
    font-size: 14px;
    margin-bottom: 8px;
}

audio {
    width: 100%;
    max-width: 350px;
    margin-top: 10px;
}

#replay {
    display: none;
}

.heart {
    position: fixed;
    bottom: -30px;
    color: rgba(201, 135, 148, 0.5);
    pointer-events: none;
    animation: floatUp 8s linear forwards;
    z-index: -1;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes letterOpen {
    from {
        opacity: 0;
        transform: translateY(25px) scale(0.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    15% { opacity: 0.7; }
    100% {
        transform: translateY(-110vh) rotate(35deg);
        opacity: 0;
    }
}

@media (max-width: 480px) {
    h1 { font-size: 25px; }

    .letter {
        padding: 23px 18px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div id="opening">
        <h1>Someone Special ♡</h1>
        <p class="subtitle">
            There's a little letter waiting for you.
        </p>

        <input
            type="text"
            id="nameInput"
            placeholder="Enter your name..."
            autocomplete="off"
        >

        <br>

        <button onclick="openLetter()">Open Letter</button>

        <p id="errorMessage">
            wrong name! this letter isn't for you. ♡
        </p>
    </div>

    <div class="letter" id="letter">
        <div class="letter-title">A letter for you ♡</div>

        <div id="confessionText"></div>

        <div class="music" id="music">
            <p>One last thing... ♡</p>
            <p><i>A little song for you.</i></p>

            <audio id="song" controls preload="none">
                <source
                    src="it-might-be-you-instrumental.mp3"
                    type="audio/mpeg"
                >
                Your browser does not support audio.
            </audio>
        </div>
    </div>

    <button id="replay" onclick="replayLetter()">
        Read Again ♡
    </button>

</div>

<script>

const confession = `hiii sayy, naa unta koy gusto isulti nimo nga dugay na gyud nako gusto i share, pero wala lang gyud ko nakakita og sakto nga time ug courage para isulti ni. since elementary pa ta, naa na gyud koy feelings para nimo. sauna, wala ra nako gi mind kay abi nako simple crush ra ni nga mawala ra kadugayan. pero as time passed, na realize nako nga wala diay siya nawala. daghan na ang nausab since then, ug dili na pud ta parehas ka close sauna, pero naa gihapon akong feelings para nimo. if ever naka notice ka nga usahay murag wala tika tagda or maglikay ko nimo, i'm really sorry about that. dili gyud to tungod kay dili ko ganahan makig istorya nimo or wala koy gana makig interact nimo. usahay ma awkward lang gyud ko kay dili ko kabalo unsaon pag act around you, especially knowing nga naa koy feelings para nimo. i hope wala nimo na misunderstood akong actions sauna. i also want to thank you sa mga little things nga imong gibuhat para nako. especially sa mga times nga gina librehan ko nimo and sa mga moments nga magkauban ta. basin simple ra to para nimo, pero i really appreciate those things more than you think. honestly, dugay na kaayo ni nako gusto isulti, pero karon pa gyud ko nakakuha og courage. i'm not telling you this because naa koy gi expect nga mahitabo between us. dili pud ko nangayo og answer or expecting you to feel the same way. gusto lang gyud nako nga ma express akong feelings nga dugay na nako gitago. i hope nga dili ka ma pressure after nimo mabasa ni, and i hope nga dili pud ni mahimong reason para ma awkward ta sa usag usa. i still value our friendship, and i don't want you to feel nga kinahanglan naay mausab tungod lang kay ni open up ko nimo. i don't know if you ever noticed how special you are to me, but i hope you know that i genuinely appreciate having you in my life. i never regretted meeting you, and even though time has changed a lot of things between us, i'm still glad that we got to share those memories together. i want you to know that i see every version of you. the happy one, the quiet one, the strong one, and even the versions of yourself that you don't always show to other people. you don't have to be the same person every day for you to be appreciated. no matter how much you change or grow, i'll always be glad that i got to know different sides of you. and i hope you never feel like you have to hide any part of yourself just to be appreciated. whatever happens, i'm still happy nga naka ila ila ko nimo. you've been important to me for a long time, and i just wanted you to know how much i appreciate you. and lastly, i'm genuinely grateful that i have a best friend like you. i'm grateful that i got a front row seat to your life, to your growth, and to all the little moments that make you who you are. getting to know you and being part of some of your memories is something i'll always appreciate. i'm really glad that life gave me the chance to know you and call you my best friend. that's all. i just wanted to be honest with you, finally. also, i hope nga this stays between us lang. personal ni para nako, and i would really appreciate it if dili na nato i share sa uban. gusto lang nako nga kita ra duha ang makahibalo ani. ♡`;

let typingTimer;

function openLetter() {
    const name = document
        .getElementById("nameInput")
        .value.trim();

    const error = document.getElementById("errorMessage");

    if (name.toLowerCase() !== "zaira") {
        error.style.display = "block";
        return;
    }

    error.style.display = "none";

    document.getElementById("opening").style.display = "none";
    document.getElementById("letter").style.display = "block";

    typeWriter();
}

function typeWriter() {
    clearInterval(typingTimer);

    const textElement =
        document.getElementById("confessionText");

    const replayButton =
        document.getElementById("replay");

    const music =
        document.getElementById("music");

    const song =
        document.getElementById("song");

    song.pause();
    song.currentTime = 0;

    textElement.textContent = "";
    replayButton.style.display = "none";
    music.style.display = "none";

    let index = 0;

    typingTimer = setInterval(() => {
        textElement.textContent += confession.charAt(index);
        index++;

        if (index >= confession.length) {
            clearInterval(typingTimer);

            music.style.display = "block";
            replayButton.style.display = "inline-block";

            document.getElementById("music").scrollIntoView({
                behavior: "smooth",
                block: "nearest"
            });
        }
    }, 28);
}

function replayLetter() {
    typeWriter();
}

document.getElementById("nameInput")
    .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            openLetter();
        }
    });

// Floating heart animation

function createHeart() {
    const heart = document.createElement("div");

    heart.className = "heart";
    heart.textContent = "♡";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize =
        (15 + Math.random() * 20) + "px";

    heart.style.animationDuration =
        (6 + Math.random() * 5) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 11000);
}

setInterval(createHeart, 900);

</script>

</body>
</html>

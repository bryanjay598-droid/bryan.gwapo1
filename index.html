
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CC105</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #f8eee8, #efd9d5, #f7e8df);
    color: #654b4b;
    overflow-x: hidden;
}

.screen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.card {
    width: 100%;
    max-width: 430px;
    text-align: center;
    padding: 30px 20px;
    animation: fadeIn 1.2s ease;
}

.small-text {
    font-size: 12px;
    letter-spacing: 3px;
    color: #a77b7b;
    text-transform: uppercase;
}

h1 {
    font-weight: normal;
    font-size: 29px;
    margin-bottom: 10px;
}

.subtitle {
    font-size: 14px;
    color: #987b78;
    margin-bottom: 35px;
}

/* ENVELOPE */

.envelope-area {
    position: relative;
    width: 230px;
    height: 155px;
    margin: 45px auto 35px;
    perspective: 800px;
}

.envelope {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #d9aeb0;
    border-radius: 5px;
    box-shadow: 0 12px 25px #9b777744;
}

.envelope::before {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    border-left: 115px solid transparent;
    border-right: 115px solid transparent;
    border-bottom: 90px solid #c99097;
    z-index: 3;
}

.flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    border-left: 115px solid transparent;
    border-right: 115px solid transparent;
    border-top: 85px solid #e7c1c0;
    transform-origin: top;
    transition: transform 1s ease;
    z-index: 4;
}

.seal {
    position: absolute;
    top: 65px;
    left: 95px;
    width: 40px;
    height: 40px;
    background: #a96770;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff4ed;
    font-size: 19px;
    z-index: 5;
    transition: opacity .5s;
}

.envelope.open .flap {
    transform: rotateX(180deg);
}

.envelope.open .seal {
    opacity: 0;
}

/* BUTTON */

button {
    margin-top: 25px;
    padding: 13px 35px;
    border: none;
    border-radius: 30px;
    background: #b77f85;
    color: white;
    font-family: Georgia, serif;
    font-size: 14px;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    background: #98636b;
    transform: translateY(-2px);
}

button:disabled {
    opacity: .7;
    cursor: default;
}

/* LETTER */

#letterScreen {
    display: none;
    padding: 35px 18px;
}

.paper {
    max-width: 650px;
    width: 100%;
    margin: auto;
    background: #fffaf3;
    padding: 35px 27px;
    border-radius: 5px;
    box-shadow: 0 10px 35px #8e626222;
    border: 1px solid #eadbd0;
    opacity: 0;
    transform: translateY(35px);
}

.paper.show {
    animation: paperAppear 1.3s ease forwards;
}

@keyframes paperAppear {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.letter-title {
    text-align: left;
    font-size: 27px;
    font-weight: normal;
    font-style: italic;
    color: #986b70;
    margin-bottom: 8px;
}

.date-text {
    text-align: left;
    font-size: 11px;
    letter-spacing: 2px;
    color: #b28e8c;
    margin-bottom: 30px;
}

#letterText {
    white-space: pre-wrap;
    font-size: 15px;
    line-height: 1.9;
    color: #705657;
    min-height: 200px;
    overflow-wrap: break-word;
}

#musicFallback {
    display: none;
    text-align: center;
    font-size: 12px;
    color: #a16e77;
    margin-top: 20px;
    cursor: pointer;
}

.signature {
    text-align: right;
    margin-top: 30px;
    font-style: italic;
    line-height: 1.8;
    color: #a16e77;
    opacity: 0;
    transition: opacity 1s ease;
}

.signature.show {
    opacity: 1;
}

/* FLOATING HEARTS */

.heart {
    position: fixed;
    bottom: -30px;
    color: #c58d96;
    opacity: .55;
    animation: floatUp 7s linear forwards;
    pointer-events: none;
    z-index: 10;
}

@keyframes floatUp {
    to {
        transform: translateY(-110vh) rotate(30deg);
        opacity: 0;
    }
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media(max-width: 480px) {
    .paper {
        padding: 28px 21px;
    }

    #letterText {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<!-- FIRST SCREEN -->

<section class="screen" id="nameScreen">

    <div class="card">

        <div class="small-text">a little something for you</div>

        <h1>You Have a Letter</h1>

        <p class="subtitle">
            Some words have been waiting to be read.
        </p>

        <div class="envelope-area">
            <div class="envelope" id="envelope">
                <div class="flap"></div>
                <div class="seal">♡</div>
            </div>
        </div>

        <button type="button" id="openButton">
            Open Letter ♡
        </button>

    </div>

</section>

<!-- LETTER SCREEN -->

<section class="screen" id="letterScreen">

    <div class="paper" id="paper">

        <h2 class="letter-title">Dear Zaira,</h2>

        <div class="date-text">
            A LITTLE LETTER FROM MY HEART ♡
        </div>

        <div id="letterText"></div>

        <div id="musicFallback">
            The music didn't start? Tap here to play ♫
        </div>

        <div class="signature" id="signature">
            with a grateful heart,<br>
            bryan ♡
        </div>

    </div>

</section>

<!-- BACKGROUND MUSIC -->

<audio
id="music"
src="./it-might-be-you-instrumental.mp3"
preload="auto"
loop>
</audio>

<script>

// COMPLETE CONFESSION

const confession = `hiii sayyyy, naa unta koy gusto isulti nimo nga dugay na gyud nako gusto i-share, pero wala lang gyud ko kakita og sakto nga time ug courage para finally masulti ni nako. since grade 6 pa ta, i've had feelings for you. sauna, abi nako simple crush ra ni nga mawala ra kadugayan. i thought it was just a normal feeling nga maagian ra nako while growing up. pero as time passed, na-realize nako nga wala diay gyud siya basta-basta nawala. daghan na kaayog nausab sukad ato, pero somehow, naa gihapon ni nga feelings. kabalo ko nga dili na ta parehas sauna. dili na ta pirmi mag-uban, mag-istorya, or magkita sama sa una. karon, panagsa na lang ta magtagbo, usahay simple hi na lang gyud atong ma-share sa usag usa. pero bisag ing-ana, malipay gihapon ko whenever makita tika. sometimes, makahuna-huna lang ko nga lahi na gyud kaayo atong situation compared sauna. naa pud mga times nga ganahan unta ko makig-istorya nimo, pero magduha-duha ko. usahay maglikay ko or murag dili tika tagdon, dili tungod kay dili ko ganahan makig-istorya nimo, but because i feel awkward and wala ko kabalo unsaon pag-act around you. sometimes, i don't even know what to say or how to start a conversation. i'm sorry kung naa koy mga moments nga murag distant ko. i never meant to make you feel nga dili ko ganahan makig-istorya nimo. gusto pud ko magpasalamat sa mga little things nga imong nabuhat para nako. labi na tong mga times nga gina-librehan ko nimo, our simple conversations, ug mga moments nga basin ordinary ra para nimo pero memorable kaayo para nako. basin dili na nimo mahinumduman tanan, pero ako, naa gihapon sa akong huna-huna. it's funny how even the smallest things can become memories nga dugay nato makalimtan. and there's something i want you to know. i appreciate you not just because i have feelings for you, but also because of the person you are. kabalo ko nga daghan na kaayog nausab sa ato, and i may not know everything that's happening in your life anymore, pero i'm still happy whenever i see you doing well. even if we're not as close as before, i'm still glad nga makita tika nga nag-grow and moving forward with your life. dili nako ni gisulti kay nag-expect ko nga parehas ta og feelings. i'm not asking you to answer me right away or feel the same way i do. gusto lang gyud nako nga mahibaw-an nimo, kay dugay na kaayo ni nako gitago. kapoy na pud siguro sigeg keep ani sa akong mind nga wala gyud nako na-share nimo. i'd rather be honest than keep wondering what could have happened if i had told you sooner. i hope nga dili ni makapa-awkward sa ato or mausab ang friendship nga naa ta. dili nako gusto nga tungod lang ani nga letter, mawala or mausab ang mga memories nga naa ta. whatever your feelings may be, i'll respect them. kung dili man parehas imong gibati, okay ra gyud. i won't force you to feel something that isn't there. gusto lang nako nga mahibaw-an nimo kung unsa gyud akong gibati. and lastly, i'm really grateful nga nahimo tika nga best friend. thankful ko sa tanan natong memories, sa mga katawa, sa mga simple nga moments, ug sa chance nga nakaila ko nimo. basin dili ko pirmi naa sa imong kilid sama sauna, pero i'm still grateful nga naa koy chance nga mahimong part sa pipila ka moments sa imong life. basin dili na gyud ta mahimong parehas sauna. maybe someday, we'll meet more people, take different paths, and make memories of our own. pero i hope you never forget nga naa koy part sa akong life nga ikaw ang usa sa mga tawo nga akong pinaka-na-appreciate. someone nga importante sa ako, even during the times nga wala nako gipakita. wala ko kahibalo unsay mahitabo after ani, and i don't want to assume what the outcome will be. pero usa ra gyud akong sure, dili gyud nako magmahay nga nakaila ko nimo, nga nahimo tika nga friend, ug nga naka-feel ko ani para nimo. because whatever happens, i'm glad that it was you. i hope pud nga diri ra unta ni kutob sa ato. this is something personal to me, and dili sayon para nako nga ibutang tanan nakong feelings into words. it would mean a lot to me if kita ra unta ang makahibalo ani. mao ra to, sayyyy. wala koy laing tuyo ani kundi ang mahimong honest nimo. dugay na nako ni gitago, and karon gusto lang gyud nako nga mahibaw-an nimo kung unsa ka ka-important sa ako. thank you for being part of my story. and if there's one thing i'll always be thankful for, it's having a front-row seat to your life, seeing you grow and go through different chapters of your story. basin dili na ta pirmi magkauban sama sauna, pero i'm genuinely happy nga nakaila ko nimo and that i got to be part of your life, even just for some moments. thank you for everything, sayyyy. <3`;

// ELEMENTS

const openButton = document.getElementById("openButton");
const envelope = document.getElementById("envelope");
const music = document.getElementById("music");
const fallback = document.getElementById("musicFallback");
const signature = document.getElementById("signature");

// OPEN LETTER

openButton.addEventListener("click", function() {

    openButton.disabled = true;

    music.volume = 0.45;

    music.play().catch(() => {
        fallback.style.display = "block";
    });

    envelope.classList.add("open");

    setTimeout(() => {

        document.getElementById("nameScreen").style.display = "none";

        const letterScreen =
            document.getElementById("letterScreen");

        letterScreen.style.display = "flex";

        setTimeout(() => {

            document.getElementById("paper").classList.add("show");

            startTyping();

        }, 300);

    }, 1100);

});

// TYPEWRITER EFFECT

function startTyping() {

    const target = document.getElementById("letterText");

    let index = 0;

    function type() {

        if (index < confession.length) {

            target.textContent += confession.charAt(index);

            index++;

            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: "smooth"
            });

            setTimeout(type, 55);

        } else {

            signature.classList.add("show");

        }

    }

    type();

}

// MUSIC FALLBACK

fallback.addEventListener("click", function() {

    music.play().then(() => {

        fallback.style.display = "none";

    }).catch(() => {

        fallback.textContent =
            "Please try tapping again ♡";

    });

});

// FLOATING HEARTS

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";

    heart.textContent = "♡";

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.fontSize =
        (12 + Math.random() * 18) + "px";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 7000);

}

setInterval(createHeart, 1000);

</script>

</body>
</html>

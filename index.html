
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CC105</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #f8e8e5, #f4d9d5, #f8eee5);
    color: #684b4b;
    overflow-x: hidden;
}

.screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px 15px;
}

.hidden {
    display: none !important;
}

.envelope-container {
    text-align: center;
    width: 100%;
    max-width: 400px;
    animation: fadeIn 1.2s ease;
}

.small-title {
    font-size: 12px;
    letter-spacing: 4px;
    color: #a77b78;
    margin-bottom: 35px;
}

.envelope {
    position: relative;
    width: 280px;
    height: 180px;
    background: #d9aaa5;
    margin: 0 auto 35px;
    border-radius: 5px;
    box-shadow: 0 12px 30px #9c777755;
}

.envelope::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    border-left: 140px solid transparent;
    border-right: 140px solid transparent;
    border-top: 105px solid #c88f8b;
    transform-origin: top;
    transition: transform 0.8s ease;
    z-index: 3;
}

.envelope::after {
    content: "♡";
    position: absolute;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff4ef;
    font-size: 38px;
    z-index: 4;
}

.envelope.open::before {
    transform: rotateX(180deg);
}

.envelope.open {
    animation: envelopeMove 1s ease;
}

.open-btn {
    border: 1px solid #bd8e89;
    background: #fff8f3;
    color: #8c6260;
    padding: 13px 30px;
    border-radius: 30px;
    font-family: Georgia, serif;
    font-size: 14px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: 0.3s;
}

.open-btn:hover {
    background: #d9aaa5;
    color: white;
}

.hint {
    font-size: 12px;
    color: #a77b78;
    margin-top: 22px;
    letter-spacing: 1px;
}

#letterScreen {
    align-items: flex-start;
    padding: 35px 15px;
}

.paper {
    width: 100%;
    max-width: 680px;
    background: #fffaf4;
    padding: 38px 28px;
    border-radius: 8px;
    box-shadow: 0 10px 35px #9c777733;
    animation: paperReveal 1.2s ease;
    line-height: 1.9;
}

.letter-title {
    text-align: center;
    font-size: 28px;
    font-weight: normal;
    color: #9b6d6a;
    margin: 0 0 10px;
}

.date-text {
    text-align: center;
    font-size: 10px;
    letter-spacing: 3px;
    color: #b58d88;
    margin-bottom: 35px;
}

#letterText {
    white-space: pre-wrap;
    font-size: 15px;
    line-height: 2;
    color: #684f4d;
    text-align: left;
}

.signature {
    opacity: 0;
    text-align: right;
    margin-top: 35px;
    color: #9b6d6a;
    font-style: italic;
    line-height: 1.8;
    transition: opacity 2s ease;
}

.signature.show {
    opacity: 1;
}

.music-note {
    text-align: center;
    font-size: 11px;
    color: #b58d88;
    margin-top: 30px;
}

.music-btn {
    display: block;
    margin: 15px auto 0;
    background: transparent;
    border: 1px solid #bd8e89;
    color: #9b6d6a;
    padding: 9px 18px;
    border-radius: 20px;
    font-family: Georgia, serif;
    cursor: pointer;
}

.heart {
    position: fixed;
    bottom: -20px;
    color: #d99a9b;
    pointer-events: none;
    animation: floatHeart 6s linear forwards;
    z-index: 10;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes paperReveal {
    from { opacity: 0; transform: translateY(35px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes envelopeMove {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
}

@keyframes floatHeart {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    15% { opacity: 0.8; }
    100% {
        transform: translateY(-110vh) rotate(35deg);
        opacity: 0;
    }
}

@media (max-width: 480px) {
    .paper {
        padding: 30px 20px;
    }

    #letterText {
        font-size: 14px;
        line-height: 1.9;
    }

    .envelope {
        width: 250px;
    }

    .envelope::before {
        border-left-width: 125px;
        border-right-width: 125px;
    }
}
</style>
</head>

<body>

<section class="screen" id="nameScreen">
    <div class="envelope-container">
        <div class="small-title">A LETTER FROM MY HEART</div>

        <div class="envelope" id="envelope"></div>

        <button class="open-btn" id="openBtn">
            Open Letter ♡
        </button>

        <div class="hint">a little something for you</div>
    </div>
</section>

<section class="screen hidden" id="letterScreen">
    <div class="paper">
        <h2 class="letter-title">Dear Zaira,</h2>

        <div class="date-text">
            A LITTLE LETTER FROM MY HEART ♡
        </div>

        <div id="letterText"></div>

        <div class="signature" id="signature">
            with a grateful heart,<br>
            bryan ♡
        </div>

        <div class="music-note">
            ♡ a little song to accompany this letter ♡
        </div>

        <button class="music-btn" id="musicBtn">
            Play Music ♡
        </button>
    </div>
</section>

<audio id="music"
       src="./it-might-be-you-instrumental.mp3"
       preload="auto"
       loop>
</audio>

<script>
const confession = `hiii sayyyy, naa unta koy gusto isulti nimo nga dugayyyy na gyud nako gusto i-share, pero wala lang gyud ko kakita og sakto nga time ug courage para finally masulti ni nako. since grade 6 pa ta, i've had feelings for you. sauna, abi nako simple crush ra ni nga mawala ra kadugayan. i thought it was just a normal feeling nga maagian ra nako while growing up. pero as time passed, na-realize nako nga wala diay gyud siya basta-basta nawala. daghan na kaayog nausab, daghan na kaayog nahitabo, and we've both grown into different people, pero somehow, naa gihapon ni nga feelings. kabalo ko nga dili na ta parehas sauna. dili na ta pirmi mag-uban, mag-istorya, or magkita sama sa una. karon, panagsa na lang ta magtagbo, usahay simple hi na lang gyud atong ma-share sa usag usa. pero bisag ing-ana, malipay gihapon ko nga makita ka. sometimes, i find it amazing how things have changed. sauna, mas daghan pa ta og chances nga magkauban ug mag-istorya, pero karon panagsa na lang ta magkita. even so, wala gihapon nausab kung unsa ka ka-important sa ako. naa pud mga times nga ganahan unta ko makig-istorya nimo, pero magduha-duha ko. usahay maglikay ko or murag dili tika tagdon, dili tungod kay dili ko ganahan makig-istorya nimo, but because i just feel awkward and wala ko kabalo unsaon pag-act around you. sometimes, i don't even know what to say or how to start a conversation. i'm sorry kung naa koy mga moments nga murag distant ko. i never meant to make you feel nga dili ko ganahan makig-istorya nimo. gusto pud ko magpasalamat sa mga little things nga imong nabuhat para nako. labi na tong mga times nga gina-librehan ko nimo, our simple conversations, ug mga moments nga basin ordinary ra para nimo pero memorable kaayo para nako. basin dili na nimo mahinumduman tanan, pero ako, naa gihapon sa akong huna-huna. sometimes, we don't need grand gestures to appreciate someone. even the smallest things can leave memories that stay with us for a long time. and there's something i want you to know. i see every version of you. dili lang katong ikaw sauna nga akong nailhan, but also the person you are today and the person you're still becoming. kabalo ko nga daghan na kaayog nausab sa ato, and i may not know everything that's happening in your life anymore, pero i still appreciate seeing you grow. even from afar, i'm happy knowing that you're moving forward, discovering yourself, and making your own memories. dili nako ni gisulti kay nag-expect ko nga parehas ta og feelings. i'm not asking you to answer me right away or feel the same way i do. gusto lang gyud nako nga mahibaw-an nimo, kay dugay na kaayo ni nako gitago. i've reached a point where i'd rather be honest than keep wondering what could have happened if i had told you sooner. i hope nga dili ni makapa-awkward sa ato or mausab ang friendship nga naa ta. dili nako gusto nga tungod lang ani nga letter, mawala or mausab ang mga memories nga naa ta. whatever your feelings may be, i'll respect them. kung dili man parehas imong gibati, okay ra gyud. i won't force you to feel something that isn't there. i just want you to be honest with yourself, just as i'm trying to be honest with you. and lastly, i'm really grateful nga nahimo tika nga best friend. thankful ko sa tanan natong memories, sa mga katawa, sa mga simple nga moments, ug sa chance nga nakaila ko nimo. if there's one thing i'll always be thankful for, it's having a front-row seat to your life, seeing you grow and go through different chapters of your story. basin dili ko pirmi naa sa imong kilid sama sauna, pero i'm still grateful nga naa koy chance nga mahimong part sa pipila ka moments sa imong life. basin dili na gyud ta mahimong parehas sauna. maybe someday, we'll meet more people, take different paths, and make memories of our own. pero i hope you never forget nga there was a time in my life when you were one of the people i valued the most. someone i genuinely appreciated, even during the times nga wala nako gipakita. wala ko kahibalo unsay mahitabo after ani, and i don't want to assume what the outcome will be. pero usa ra gyud akong sure, dili gyud nako magmahay nga nakaila ko nimo, nga nahimo tika nga friend, ug nga naka-feel ko ani para nimo. because whatever happens, i'm glad that it was you. i hope pud nga diri ra unta ni kutob sa ato. this is something personal to me, and it wasn't easy putting all of these feelings into words. it would mean a lot to me if kita ra unta ang makahibalo ani. mao ra to, sayyyy. wala koy laing tuyo ani kundi ang mahimong honest nimo. dugay na nako ni gitago, and karon gusto lang gyud nako nga mahibaw-an nimo kung unsa ka ka-important sa ako. thank you for being part of my story. and i hope nga bisag unsa pa ang mahitabo, you know that i'll always have a genuine appreciation for you.`;

const nameScreen = document.getElementById("nameScreen");
const letterScreen = document.getElementById("letterScreen");
const envelope = document.getElementById("envelope");
const openBtn = document.getElementById("openBtn");
const letterText = document.getElementById("letterText");
const signature = document.getElementById("signature");
const music = document.getElementById("music");
const musicBtn = document.getElementById("musicBtn");

let typingStarted = false;
let musicStarted = false;

openBtn.addEventListener("click", () => {
    envelope.classList.add("open");

    music.play().then(() => {
        musicStarted = true;
        musicBtn.textContent = "Pause Music ♡";
    }).catch(() => {
        musicBtn.textContent = "Play Music ♡";
    });

    setTimeout(() => {
        nameScreen.classList.add("hidden");
        letterScreen.classList.remove("hidden");

        if (!typingStarted) {
            typingStarted = true;
            startTyping();
        }
    }, 900);
});

function startTyping() {
    let index = 0;

    function type() {
        if (index < confession.length) {
            letterText.textContent += confession.charAt(index);
            index++;

            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: "smooth"
            });

            setTimeout(type, 22);
        } else {
            signature.classList.add("show");
        }
    }

    type();
}

musicBtn.addEventListener("click", () => {
    if (music.paused) {
        music.play().then(() => {
            musicBtn.textContent = "Pause Music ♡";
        }).catch(() => {
            musicBtn.textContent = "Play Music ♡";
        });
    } else {
        music.pause();
        musicBtn.textContent = "Play Music ♡";
    }
});

function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = Math.random() > 0.5 ? "♡" : "♥";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (12 + Math.random() * 15) + "px";
    heart.style.animationDuration = (4 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 8000);
}

setInterval(createHeart, 1000);
</script>

</body>
</html>

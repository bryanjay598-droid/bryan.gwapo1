<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CC105</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #f8eee8, #efd9d5, #f7e8df);
    color: #654b4b;
    overflow-x: hidden;
}

.screen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.card {
    width: 100%;
    max-width: 430px;
    text-align: center;
    padding: 30px 20px;
    animation: fadeIn 1.2s ease;
}

.small-text {
    font-size: 12px;
    letter-spacing: 3px;
    color: #a77b7b;
    text-transform: uppercase;
}

h1 {
    font-weight: normal;
    font-size: 29px;
    margin-bottom: 10px;
}

.subtitle {
    font-size: 14px;
    color: #987b78;
    margin-bottom: 35px;
}

/* ENVELOPE */

.envelope-area {
    position: relative;
    width: 230px;
    height: 155px;
    margin: 45px auto 35px;
    perspective: 800px;
}

.envelope {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #d9aeb0;
    border-radius: 5px;
    box-shadow: 0 12px 25px #9b777744;
}

.envelope::before {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    border-left: 115px solid transparent;
    border-right: 115px solid transparent;
    border-bottom: 90px solid #c99097;
    z-index: 3;
}

.flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    border-left: 115px solid transparent;
    border-right: 115px solid transparent;
    border-top: 85px solid #e7c1c0;
    transform-origin: top;
    transition: transform 1s ease;
    z-index: 4;
}

.seal {
    position: absolute;
    top: 65px;
    left: 95px;
    width: 40px;
    height: 40px;
    background: #a96770;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff4ed;
    font-size: 19px;
    z-index: 5;
    transition: opacity .5s;
}

.envelope.open .flap {
    transform: rotateX(180deg);
}

.envelope.open .seal {
    opacity: 0;
}

/* INPUT */

input {
    width: 85%;
    padding: 13px;
    border: none;
    border-bottom: 1px solid #c69b9b;
    background: transparent;
    text-align: center;
    outline: none;
    font-family: Georgia, serif;
    font-size: 16px;
    color: #654b4b;
}

input::placeholder {
    color: #b28e8c;
}

button {
    margin-top: 25px;
    padding: 13px 35px;
    border: none;
    border-radius: 30px;
    background: #b77f85;
    color: white;
    font-family: Georgia, serif;
    font-size: 14px;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    background: #98636b;
    transform: translateY(-2px);
}

#error {
    color: #a14e5c;
    font-size: 13px;
    margin-top: 15px;
}

/* LETTER */

#letterScreen {
    display: none;
    padding: 35px 18px;
}

.paper {
    max-width: 650px;
    width: 100%;
    margin: auto;
    background: #fffaf3;
    padding: 35px 27px;
    border-radius: 5px;
    box-shadow: 0 10px 35px #8e626222;
    border: 1px solid #eadbd0;
    opacity: 0;
    transform: translateY(35px);
}

.paper.show {
    animation: paperAppear 1.3s ease forwards;
}

@keyframes paperAppear {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.letter-title {
    text-align: center;
    font-size: 25px;
    font-weight: normal;
    color: #986b70;
    margin-bottom: 8px;
}

.date-text {
    text-align: center;
    font-size: 11px;
    letter-spacing: 2px;
    color: #b28e8c;
    margin-bottom: 30px;
}

#letterText {
    white-space: pre-wrap;
    font-size: 15px;
    line-height: 1.9;
    color: #705657;
    min-height: 200px;
    overflow-wrap: break-word;
}

#musicFallback {
    display: none;
    text-align: center;
    font-size: 12px;
    color: #a16e77;
    margin-top: 20px;
    cursor: pointer;
}

.signature {
    text-align: right;
    margin-top: 30px;
    font-style: italic;
    line-height: 1.8;
    color: #a16e77;
    opacity: 0;
    transition: opacity 1s ease;
}

.signature.show {
    opacity: 1;
}

/* FLOATING HEARTS */

.heart {
    position: fixed;
    bottom: -30px;
    color: #c58d96;
    opacity: .55;
    animation: floatUp 7s linear forwards;
    pointer-events: none;
    z-index: 10;
}

@keyframes floatUp {
    to {
        transform: translateY(-110vh) rotate(30deg);
        opacity: 0;
    }
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media(max-width: 480px) {
    .paper {
        padding: 28px 21px;
    }

    #letterText {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<!-- FIRST SCREEN -->

<section class="screen" id="nameScreen">

    <div class="card">

        <div class="small-text">a little something for you</div>

        <h1>You Have a Letter</h1>

        <p class="subtitle">
            Some words have been waiting to be read.
        </p>

        <div class="envelope-area">
            <div class="envelope" id="envelope">
                <div class="flap"></div>
                <div class="seal">♡</div>
            </div>
        </div>

        <form id="nameForm">

            <input
                type="text"
                id="nameInput"
                placeholder="Write your name..."
                autocomplete="off"
                required
            >

            <br>

            <button type="submit">Open Letter ♡</button>

        </form>

        <p id="error"></p>

    </div>

</section>


<!-- LETTER SCREEN -->

<section class="screen" id="letterScreen">

    <div class="paper" id="paper">

        <h2 class="letter-title">A Letter For You</h2>

        <div class="date-text">FROM THE HEART ♡</div>

        <div id="letterText"></div>

        <div id="musicFallback">
            The music didn't start? Tap here to play ♫
        </div>

        <div class="signature" id="signature">
            with a grateful heart,<br>
            bryan ♡
        </div>

    </div>

</section>


<!-- BACKGROUND MUSIC -->

<audio
    id="music"
    src="./it-might-be-you-instrumental.mp3"
    preload="auto"
    loop>
</audio>


<script>

// COMPLETE CONFESSION

const confession = `hiii sayyyy, naa unta koy gusto isulti nimo nga dugayyyy na gyud nako gusto i-share, pero wala lang gyud ko nakakita og sakto nga time ug courage para isulti ni. since elementary pa ta, i've had feelings for you. sauna, abi nako simple crush ra ni nga mawala ra kadugayan, pero as time passed, i realized nga wala diay siya nawala. daghan na kaayog nausab over the years, and we're not as close as we used to be, pero naa gihapon akong feelings para nimo. i know we have our own lives now, our own responsibilities, and we're slowly growing into different versions of ourselves, but that doesn't change how much i appreciate having you in my life. if ever naka-notice ka nga usahay murag wala tika tagda or maglikay ko nimo, i'm really sorry about that. dili gyud to tungod kay dili ko ganahan makig-istorya nimo. usahay ma-awkward lang gyud ko kay dili ko kabalo unsaon pag-act around you, especially knowing nga naa koy feelings para nimo. there were times nga gusto unta ko makig-istorya nimo, pero wala ko kabalo unsay isulti. i hope wala nimo na-misunderstood akong actions sauna. i also want to thank you for the little things you've done for me, especially sa mga times nga gina-librehan ko nimo and sa mga moments nga magkauban ta. basin simple ra to para nimo, but those little things mean more to me than you probably realize. there are moments nga basin nalimtan na nimo, pero ako, i still remember them. sometimes, the simplest moments become the memories we appreciate the most. honestly, dugay na kaayo ni nako gusto isulti, pero karon pa gyud ko nakakuha og courage. i'm not telling you this because i'm expecting something in return. dili pud ko nangayo nga you should feel the same way or give me an answer right away. gusto lang gyud nako nga ma-express akong feelings nga dugay na nako gitago. i hope nga dili ka ma-pressure after nimo mabasa ni, and i hope nga dili pud ni mahimong reason para ma-awkward ta sa usag usa. i still value our friendship, and i don't want you to feel nga kinahanglan naay mausab tungod lang kay ni-open up ko nimo. if you don't feel the same way, that's okay. i'll respect your feelings, and i understand if you need time or space. i want you to know that i see every version of you. the happy one, the quiet one, the strong one, and even the versions of yourself that you don't always show to other people. you don't have to be the same person every day just to be appreciated. you don't have to be perfect or pretend to be someone else. whatever version of yourself you become, i'm glad i got the chance to know you. i never regretted meeting you, and even though time has changed a lot of things between us, i'm still thankful for all the memories we've shared. and lastly, i'm genuinely grateful that i have a best friend like you. i'm grateful that i got a front row seat to your life, your growth, and all the little moments that make you who you are. getting to know you and being part of some of your memories is something i'll always appreciate. maybe someday we'll look back at these years and realize how much we've grown, but no matter where life takes us, i'll always be thankful that our paths crossed and that i got the chance to call you my best friend. whatever happens after this, i hope you know that i genuinely appreciate you. that's all. i just wanted to be honest with you, finally. also, i hope nga this stays between us lang. personal kaayo ni para nako, and it would really mean a lot to me if kita ra unta ang makahibalo ani. ♡`;


// ELEMENTS

const form = document.getElementById("nameForm");
const input = document.getElementById("nameInput");
const error = document.getElementById("error");
const envelope = document.getElementById("envelope");
const music = document.getElementById("music");
const fallback = document.getElementById("musicFallback");
const signature = document.getElementById("signature");


// OPEN LETTER

form.addEventListener("submit", function(e) {

    e.preventDefault();

    const name = input.value.trim().toLowerCase();

    if (name !== "zaira") {

        error.textContent =
            "Hmm, this letter isn't for you. Try again ♡";

        return;
    }

    error.textContent = "";

    music.volume = 0.45;

    music.play().catch(() => {
        fallback.style.display = "block";
    });

    envelope.classList.add("open");

    setTimeout(() => {

        document.getElementById("nameScreen").style.display = "none";

        const letterScreen =
            document.getElementById("letterScreen");

        letterScreen.style.display = "flex";

        setTimeout(() => {

            document.getElementById("paper").classList.add("show");

            startTyping();

        }, 300);

    }, 1100);

});


// TYPEWRITER EFFECT

function startTyping() {

    const target = document.getElementById("letterText");

    let index = 0;

    function type() {

        if (index < confession.length) {

            target.textContent += confession.charAt(index);

            index++;

            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: "smooth"
            });

            setTimeout(type, 22);

        } else {

            signature.classList.add("show");

        }

    }

    type();

}


// MUSIC FALLBACK

fallback.addEventListener("click", function() {

    music.play().then(() => {

        fallback.style.display = "none";

    }).catch(() => {

        fallback.textContent =
            "Please try tapping again ♡";

    });

});


// FLOATING HEARTS

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";

    heart.textContent = "♡";

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.fontSize =
        (12 + Math.random() * 18) + "px";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 7000);

}

setInterval(createHeart, 1000);

</script>

</body>
</html>
